<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Juego de Brincar</title>

    <style>

        body {
            font-family: Arial;
            text-align: center;
            background-color: #e8f4ff;
        }

        h1 {
            margin-top: 30px;
        }

        #juego {
            width: 800px;
            height: 300px;
            border: 3px solid black;
            margin: 30px auto;
            position: relative;
            overflow: hidden;
            background-color: white;
        }

        #jugador {
            width: 50px;
            height: 50px;
            background-color: blue;

            position: absolute;

            bottom: 0;
            left: 70px;
        }

        #obstaculo {
            width: 35px;
            height: 60px;

            background-color: red;

            position: absolute;

            bottom: 0;
            right: -40px;

            animation: mover 2s infinite linear;
        }

        @keyframes mover {

            from {
                right: -40px;
            }

            to {
                right: 850px;
            }
        }

        .saltar {

            animation: salto 0.7s;

        }

        @keyframes salto {

            0% {
                bottom: 0;
            }

            50% {
                bottom: 130px;
            }

            100% {
                bottom: 0;
            }

        }

        button {

            font-size: 20px;
            padding: 10px 30px;

            cursor: pointer;

        }

    </style>

</head>

<body>


<h1>🏃 Juego de Brincar Obstáculos</h1>

<p>Presiona ESPACIO o el botón para brincar.</p>


<div id="juego">

    <div id="jugador"></div>

    <div id="obstaculo"></div>

</div>


<button onclick="saltar()">

    Brincar

</button>


<h2 id="puntos">

    Puntos: 0

</h2>


<script>

    let jugador = document.getElementById("jugador");

    let obstaculo = document.getElementById("obstaculo");

    let puntos = 0;


    function saltar() {

        if (!jugador.classList.contains("saltar")) {

            jugador.classList.add("saltar");

        }


        setTimeout(function() {

            jugador.classList.remove("saltar");

        }, 700);

    }


    document.addEventListener("keydown", function(event) {

        if (event.code === "Space") {

            saltar();

        }

    });


    setInterval(function() {

        let jugadorAbajo =
            parseInt(window.getComputedStyle(jugador).getPropertyValue("bottom"));


        let obstaculoDerecha =
            parseInt(window.getComputedStyle(obstaculo).getPropertyValue("right"));


        let posicionObstaculo =
            800 - obstaculoDerecha;


        if (

            posicionObstaculo > 70 &&

            posicionObstaculo < 120 &&

            jugadorAbajo < 60

        ) {

            alert("💥 Perdiste\nPuntos: " + puntos);

            puntos = 0;

        }

    }, 10);


    setInterval(function() {

        puntos++;

        document.getElementById("puntos").innerText =
            "Puntos: " + puntos;

    }, 1000);

</script>


</body>

</html>
